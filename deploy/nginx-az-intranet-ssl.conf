# HTTPS für az-intranet.de – in /etc/nginx/sites-available/ legen, mit sites-enabled verlinken.
# Dann: sudo nginx -t && sudo systemctl reload nginx
#
# Häufiger Fehler: Nur Port-80 konfiguriert oder Certbot-HTTPS ohne /socket.io/ → Browser meldet
# "WebSocket connection to wss://az-intranet.de/socket.io/ ... failed".
# Die Blöcke für /api/, /socket.io/, /uploads/ müssen im SSL-server { } VOR "location /" stehen.
#
# WICHTIG: Connection NICHT immer auf "upgrade" setzen – Socket.io nutzt zuerst HTTP-Polling;
# festes "upgrade" kann Polling brechen. Stattdessen $connection_upgrade (http-Block, einmal pro nginx.conf).
#
# root an euren Deploy-Pfad anpassen (z. B. /var/www/az-intranet/html oder /var/www/az-intranet).

# Einmalig in http { } der Haupt-nginx.conf einbinden (sonst ist $connection_upgrade leer / Fehler):
#   include /var/www/.../deploy/nginx-map-connection-upgrade.conf;

# Optional HTTP → HTTPS:
# server {
#     listen 80;
#     server_name az-intranet.de www.az-intranet.de;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    server_name az-intranet.de www.az-intranet.de;

    root /var/www/az-intranet/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/az-intranet.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/az-intranet.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ^~ /api/ {
        client_max_body_size 200M;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

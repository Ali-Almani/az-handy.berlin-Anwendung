# Nginx-Konfiguration für az-schnelltest.berlin
# Kopieren nach: /etc/nginx/sites-available/az-handy

server {
    listen 80;
    server_name az-schnelltest.berlin www.az-schnelltest.berlin;

    # Große IMEI-Listen (Excel-Upload) – Standard 1MB reicht nicht
    client_max_body_size 50M;

    root /var/www/az-schnelltest.berlin;

    # index.html nie cachen – damit alle Benutzer immer die neueste App bekommen (IMEI-Liste etc.)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io für Echtzeit-Updates (News-Popup, Benachrichtigungen)
    location /socket.io {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS für az-schnelltest.berlin – nach /etc/nginx/sites-available/ kopieren,
# mit sites-enabled verlinken, dann: sudo nginx -t && sudo systemctl reload nginx
#
# HTTP → HTTPS (optional, eigener server-Block, Port 80):
#
# server {
#     listen 80;
#     server_name az-schnelltest.berlin www.az-schnelltest.berlin;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    server_name az-schnelltest.berlin www.az-schnelltest.berlin;

    root /var/www/az-schnelltest.berlin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/az-schnelltest.berlin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/az-schnelltest.berlin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Excel, IMEI, NEWS, Formular-PDF – Standard 1M in Nginx → 413 Request Entity Too Large
    client_max_body_size 200M;

    # index.html nie cachen – neue Client-Builds sofort sichtbar
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ^~ und VOR location /: sonst kann POST /api/... in try_files laufen → 405 Not Allowed
    location ^~ /api/ {
        client_max_body_size 200M;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Einmal in der globalen nginx.conf innerhalb von http { } einbinden, z. B.:
#   include /pfad/zu/projekt/deploy/nginx-map-connection-upgrade.conf;
# Benötigt für location /socket.io/ mit proxy_set_header Connection $connection_upgrade;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

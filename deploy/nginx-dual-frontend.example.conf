# Beispiel: ein Node-Backend (PM2), zwei statische Frontends.
# Passe root, server_name an. proxy_pass: hier 5000 (wie PORT in server/.env); bei dir z. B. 3000 → überall ersetzen.
# Nach /etc/nginx/sites-available/ kopieren, Symlink nach sites-enabled, nginx -t, reload.
#
# Wenn Login POST /api/... mit 405 endet: In jedem server { … } Block (auch HTTPS nach Certbot!)
# müssen diese location-Zeilen VOR "location /" stehen. Ohne /api-Proxy landet POST im SPA try_files → 405.

# --- TEST ---
server {
    listen 80;
    server_name az-schnelltest.berlin www.az-schnelltest.berlin;

    root /var/www/az-schnelltest;
    index index.html;

    client_max_body_size 100M;

    # ^~: hat Vorrang vor regex; verhindert, dass /api an try_files fällt
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- LIVE ---
